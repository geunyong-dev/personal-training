# 로컬 개발용 Supabase 설정 (supabase start)
# 클라우드 프로젝트에서는 대시보드에서 같은 값을 설정한다. README의 "배포" 참고.
project_id = "workout-app"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
# OAuth 동의 화면(/oauth/consent)과 로그인 화면이 있는 웹 주소 (Expo 웹 빌드)
site_url = "http://localhost:8081"
additional_redirect_urls = ["workoutapp://auth-callback", "http://localhost:8081/auth-callback"]
jwt_expiry = 3600
enable_signup = true
# MCP 인증은 비대칭 서명 JWT(ES256/RS256)가 필요하다: `supabase gen signing-key --algorithm ES256`
signing_keys_path = "./signing_keys.json"

# Claude가 MCP 클라이언트로 붙는 OAuth 2.1 서버 (정의서 5.5)
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[auth.external.kakao]
enabled = true
client_id = "env(SUPABASE_AUTH_KAKAO_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_KAKAO_SECRET)"

[functions.mcp]
# 함수가 직접 토큰을 검증한다 (withSupabase). 게이트웨이 JWT 검증은 끈다.
verify_jwt = false
