# Fly.io 배포 예시 (동기화 서버 + MCP). app 이름은 본인 것으로 바꾸세요.
#   fly launch --no-deploy --copy-config
#   fly volumes create pt_data --size 1 --region nrt
#   fly deploy
app = "personal-training-sync"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  WORKOUT_DATA_DIR = "/data"
  PORT = "8787"

[[mounts]]
  source = "pt_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "3s"
